<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Intelligence — прототип</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#142a45;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{display:flex;min-height:100vh}aside{width:250px;background:#142a45;color:#fff;padding:28px 17px;flex-shrink:0}.brand{font-size:21px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}.sub{font-size:11px;color:#9db8c6;margin-bottom:32px}.nav{display:block;width:100%;border:0;text-align:left;padding:13px 14px;margin:4px 0;border-radius:10px;background:transparent;color:#c9d7e0;cursor:pointer;font-size:14px}.nav:hover,.nav.active{background:#2f6b86;color:white}main{flex:1;min-width:0;padding:30px 38px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:26px}h1{margin:0;font-size:29px}p{color:#667c8c}select,button{padding:10px 13px;border:1px solid #d6e1e9;border-radius:9px;background:white;color:#142a45;cursor:pointer}select{max-width:220px}.filters{display:flex;gap:8px;flex-wrap:wrap}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid #e3eaf0;border-radius:16px;padding:22px;box-shadow:0 5px 22px #142a4508}.kpi-label{color:#718796;font-size:13px}.num{font-size:26px;font-weight:750;margin-top:12px;letter-spacing:-1px}.small{font-size:12px;color:#718796;margin-top:7px}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:17px;margin-top:18px}h2{font-size:17px;margin:0 0 18px}.bars{height:230px;display:flex;align-items:end;gap:14px;padding:12px 0 0}.barcol{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;gap:8px;font-size:12px;color:#667c8c}.barstack{width:100%;display:flex;align-items:end;justify-content:center;gap:4px;height:190px}.bar{width:37%;border-radius:6px 6px 0 0;min-height:2px;background:#2f6b86}.bar.profit{background:#d8a66b}.legend{font-size:12px;color:#667c8c;margin-top:15px}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 5px 0 15px;background:#2f6b86}.dot.gold{background:#d8a66b}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:13px 9px;border-bottom:1px solid #edf1f4}th{color:#728695;font-weight:600}th[data-sort]{cursor:pointer}td:last-child,th:last-child{text-align:right}.badge{display:inline-block;border-radius:20px;padding:5px 10px;background:#e8f1f4;color:#2f6b86;font-size:12px}.note{border-left:3px solid #d8a66b;padding:12px 16px;background:#fbf8f1;border-radius:0 8px 8px 0;margin:12px 0}.hidden{display:none}.muted{color:#748898}.section{margin-top:20px}.progress{background:#e8f1f4;border-radius:5px;height:9px;overflow:hidden}.progress>div{height:100%;background:#2f6b86}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.empty{padding:28px;background:#f4f8fa;border-radius:12px;text-align:center}footer{margin:26px 0;color:#8798a4;font-size:12px}@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}aside{width:100%;padding:15px}.brand{margin:0}.sub{margin:4px 0 10px}.navbox{display:flex;overflow:auto;gap:4px}.nav{white-space:nowrap;width:auto;padding:10px}main{padding:22px 14px}.kpis{gap:8px}.card{padding:15px}.num{font-size:21px}.grid2{grid-template-columns:1fr}h1{font-size:24px}}.sales-tools{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin:14px 0 20px}.sales-tools label{display:grid;gap:6px;color:#667c8c;font-size:13px}.sales-tools input{min-width:240px;padding:11px;border:1px solid #d6e1e9;border-radius:9px;font:inherit}.sort-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.sort-tools button{font-size:12px;padding:9px}.sort-tools .selected{background:#e8f1f4;border-color:#2f6b86}.clickrow{cursor:pointer}.clickrow:hover{background:#f0f7fa}.total{background:#edf5f8;font-weight:750}.total td{border-top:2px solid #2f6b86}.detail-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.detail-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.detail-kpis .card{padding:14px}.detail-kpis .num{font-size:21px}@media(max-width:1100px){.detail-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.detail-kpis{grid-template-columns:1fr 1fr}.sales-tools input{min-width:0;width:100%}.detail-kpis .num{font-size:17px}} </style></head><body><div class="app"><aside><div class="brand">◈ Sales Intelligence</div><div class="sub">АНАЛИТИКА ПРОДАЖ · DEMO</div><div class="navbox" id="nav"></div></aside><main><header><div><h1 id="title">Дашборд продаж</h1><p id="subtitle">Управленческая аналитика на демонстрационных данных</p></div><span class="badge">● Демо-режим</span></header><div class="filters"><select id="period"><option value="all">Январь — июнь 2026</option><option value="q1">I квартал 2026</option><option value="q2">II квартал 2026</option><option value="jun">Июнь 2026</option></select><select id="category"><option value="all">Все категории</option></select><select id="channel"><option value="all">Все каналы</option></select><button id="reset">Сбросить фильтры</button></div><div id="content" class="section"></div><footer>Sales Intelligence · Интерактивный прототип v0.2 · Все данные демонстрационные. Импорт Excel/CSV — следующий этап.</footer></main></div><script>
const categories=['Электроника','Аксессуары','Товары для дома','Услуги'];const channels=['Сайт','Маркетплейс','Прямые продажи'];const products=[['Ноутбук',0,65000,46000],['Наушники',0,9200,5400],['Чехол',1,1800,760],['Зарядное устройство',1,3200,1800],['Настольная лампа',2,4800,2600],['Органайзер',2,2100,950],['Консультация',3,12500,4000],['Настройка',3,7500,2600]];const months=['Янв','Фев','Мар','Апр','Май','Июн'];let tx=[];let id=1;for(let m=0;m<6;m++)for(let p=0;p<products.length;p++)for(let k=0;k<13+(m*2)+(p%3)*3;k++){let q=1+(k%3),price=products[p][2]*(1+(m%3)*.025),discount=k%9===0?.08:0,rev=Math.round(q*price*(1-discount)),cost=q*products[p][3];tx.push({id:id++,month:m,date:`2026-${String(m+1).padStart(2,'0')}-${String(k%27+1).padStart(2,'0')}`,product:products[p][0],category:categories[products[p][1]],channel:channels[(k+p+m)%3],client:`Клиент ${String((k*7+p*11+m)%120+1).padStart(3,'0')}`,qty:q,revenue:rev,cost,order:`ORD-${m}-${p}-${k}`})}let section='Дашборд';let sort='revenue';let desc=true;let salesSearch='';let detailProduct=null;const units={'Консультация':'усл.','Настройка':'усл.','Ноутбук':'шт.','Наушники':'шт.','Чехол':'шт.','Зарядное устройство':'шт.','Настольная лампа':'шт.','Органайзер':'шт.'};const pages=['Дашборд','Анализ продаж','ABC / XYZ','Клиенты','План-факт','Аналитик','Данные'];const rub=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n)+' ₽';const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);const pct=(a,b)=>b?fmt(a/b*100)+'%':'н/д';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function filtered(){return tx.filter(x=>(period.value==='all'||(period.value==='q1'&&x.month<3)||(period.value==='q2'&&x.month>=3)||(period.value==='jun'&&x.month===5))&&(category.value==='all'||x.category===category.value)&&(channel.value==='all'||x.channel===channel.value))}function group(a,k){let m=new Map();for(let x of a){let key=x[k];if(!m.has(key))m.set(key,{name:key,revenue:0,cost:0,qty:0,count:0});let o=m.get(key);o.revenue+=x.revenue;o.cost+=x.cost;o.qty+=x.qty;o.count++}return [...m.values()]}function card(label,value,sub){return `<div class="card"><div class="kpi-label">${label}</div><div class="num">${value}</div><div class="small">${sub}</div></div>`}function table(head,rows){return `<div style="overflow:auto"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function bars(a){let mm=months.map((m,i)=>({name:m,revenue:sum(a.filter(x=>x.month===i),'revenue'),profit:sum(a.filter(x=>x.month===i),'revenue')-sum(a.filter(x=>x.month===i),'cost')}));let max=Math.max(...mm.map(x=>x.revenue),1);return `<div class="bars">${mm.map(x=>`<div class="barcol"><div class="barstack"><div class="bar" title="Выручка: ${rub(x.revenue)}" style="height:${x.revenue/max*100}%"></div><div class="bar profit" title="Валовая прибыль: ${rub(x.profit)}" style="height:${Math.max(0,x.profit)/max*100}%"></div></div>${x.name}</div>`).join('')}</div><div class="legend"><i class="dot"></i>Выручка <i class="dot gold"></i>Валовая прибыль</div>`}function render(){let a=filtered(),r=sum(a,'revenue'),c=sum(a,'cost'),p=r-c,orders=new Set(a.map(x=>x.order)).size;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.textContent===section));title.textContent=section==='Дашборд'?'Дашборд продаж':section;let html='';if(section==='Дашборд'){html=`<div class="kpis">${card('Выручка',rub(r),'За выбранный период')}${card('Валовая прибыль',rub(p),'После себестоимости')}${card('Валовая маржа',pct(p,r),'Доля валовой прибыли')}${card('Средний чек',orders?rub(r/orders):'н/д',`${orders} заказов`)}</div><div class="layout"><div class="card"><h2>Динамика продаж</h2>${bars(a)}</div><div class="card"><h2>Выручка по категориям</h2>${group(a,'category').sort((x,y)=>y.revenue-x.revenue).map(x=>`<div style="margin:16px 0"><div style="display:flex;justify-content:space-between;gap:10px;font-size:13px"><span>${esc(x.name)}</span><b>${rub(x.revenue)}</b></div><div class="progress" style="margin-top:7px"><div style="width:${r?x.revenue/r*100:0}%"></div></div></div>`).join('')}</div></div><div class="card section"><h2>Топ товаров и услуг</h2>${table(['Наименование','Выручка','Валовая прибыль'],group(a,'product').sort((x,y)=>y.revenue-x.revenue).slice(0,6).map(x=>`<tr><td>${esc(x.name)}</td><td>${rub(x.revenue)}</td><td>${rub(x.revenue-x.cost)}</td></tr>`))}</div>`}else if(section==='Анализ продаж'){html=renderSales(a)}else if(section==='ABC / XYZ'){let g=group(a,'product').sort((x,y)=>y.revenue-x.revenue);let total=sum(g,'revenue'),cum=0;let rows=g.map(x=>{let before=cum;cum+=x.revenue;let abc=before/total<.8?'A':before/total<.95?'B':'C';let arr=months.map((_,m)=>sum(a.filter(t=>t.product===x.name&&t.month===m),'qty'));let vals=arr.filter((_,m)=>period.value==='all'||(period.value==='q1'&&m<3)||(period.value==='q2'&&m>=3)||(period.value==='jun'&&m===5));let mean=sum(vals.map(q=>({q})),'q')/vals.length;let sd=Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/vals.length);let cv=mean?sd/mean*100:NaN;let xyz=vals.length<3?'Недостаточно данных':!Number.isFinite(cv)?'Нет продаж':cv<=10?'X':cv<=25?'Y':'Z';return `<tr><td>${esc(x.name)}</td><td>${rub(x.revenue)}</td><td>${pct(x.revenue,total)}</td><td><b>${abc}</b></td><td>${xyz}</td><td>${Number.isFinite(cv)?fmt(cv)+'%':'—'}</td></tr>`});html=`<div class="card"><h2>ABC / XYZ анализ</h2><p>ABC — по выручке, пороги 80% и 95%. XYZ — по месячному количеству, коэффициент вариации; минимум три месяца истории.</p>${table(['Товар','Выручка','Доля','ABC','XYZ','CV'],rows)}</div>`}else if(section==='Клиенты'){let g=group(a,'client').sort((x,y)=>y.revenue-x.revenue);let repeat=g.filter(x=>new Set(a.filter(t=>t.client===x.name).map(t=>t.order)).size>1).length;html=`<div class="kpis">${card('Уникальные клиенты',g.length,'По ID клиента')}${card('Повторные клиенты',repeat,'Более одного заказа')}${card('Доля повторных',pct(repeat,g.length),'От клиентской базы')}${card('Выручка на клиента',g.length?rub(r/g.length):'н/д','Среднее значение')}</div><div class="card section"><h2>Топ клиентов</h2>${table(['Клиент','Выручка','Заказов'],g.slice(0,15).map(x=>`<tr><td>${esc(x.name)}</td><td>${rub(x.revenue)}</td><td>${x.count}</td></tr>`))}</div>`}else if(section==='План-факт'){let g=months.map((name,i)=>{let actual=sum(a.filter(x=>x.month===i),'revenue'),plan=Math.round(sum(tx.filter(x=>x.month===i),'revenue')*1.08);return {name,actual,plan}});let plan=sum(g,'plan');html=`<div class="kpis">${card('План выручки',rub(plan),'Демонстрационный план')}${card('Факт выручки',rub(r),'Выбранная выборка')}${card('Отклонение',rub(r-plan),'Факт минус план')}${card('Выполнение',pct(r,plan),'Факт / план')}</div><div class="card section"><h2>Помесячное выполнение</h2><div class="note">План задан для всех категорий и каналов. При фильтрации по категории или каналу сравнение становится несопоставимым. Для точного план-факта потребуется загрузка плана с такой же детализацией.</div>${table(['Месяц','План (общий)','Факт (выборка)','Отклонение'],g.map(x=>`<tr><td>${x.name}</td><td>${rub(x.plan)}</td><td>${rub(x.actual)}</td><td>${rub(x.actual-x.plan)}</td></tr>`))}</div>`}else if(section==='Аналитик'){let m=pct(p,r);let gs=group(a,'product').filter(x=>x.revenue-x.cost<0);html=`<div class="card"><h2>Автоматическая диагностика</h2><div class="note"><b>Факт:</b> выручка ${rub(r)}, валовая прибыль ${rub(p)}, валовая маржа ${m}.<br><b>Интерпретация:</b> эти значения рассчитаны по выбранным фильтрам из демонстрационных транзакций.</div><div class="note"><b>Проверка убыточных позиций:</b> ${gs.length?`Обнаружено ${gs.length} позиций с отрицательной валовой прибылью.`:'По выбранным данным товаров с отрицательной валовой прибылью нет.'}</div><p>Следующий этап: сравнение периодов, факторные отклонения, проверяемые гипотезы и рекомендации. Причины изменений без подтверждающих данных не утверждаются.</p></div>`}else{html=`<div class="card"><h2>Управление данными</h2><div class="empty"><h2>Демонстрационный набор активен</h2><p>В памяти приложения ${tx.length} синтетических строк продаж за январь–июнь 2026 года. Данные не отправляются на сервер.</p><p>Загрузка Excel/CSV, проверка полей и сохранение данных будут реализованы на следующем этапе.</p><button onclick="downloadCSV()">Экспортировать демо CSV</button></div></div>`}content.innerHTML=html}function renderSales(a){let all=group(a,'product').map(x=>({...x,profit:x.revenue-x.cost,margin:x.revenue?100*(x.revenue-x.cost)/x.revenue:null,unit:units[x.name]||'ед.'}));let g=all.filter(x=>x.name.toLocaleLowerCase('ru').includes(salesSearch.toLocaleLowerCase('ru')));g.sort((x,y)=>{let av=x[sort],bv=y[sort];return (desc?-1:1)*((av??-Infinity)-(bv??-Infinity))});let r=sum(g,'revenue'),c=sum(g,'cost'),pr=r-c;let sameUnit=new Set(g.map(x=>x.unit)).size===1;let q=sameUnit?sum(g,'qty')+' '+(g[0]?.unit||''): '—';let th=['Товар / услуга','Количество','Себестоимость','Выручка','Валовая прибыль','Валовая маржа'];let rows=g.map(x=>`<tr class="clickrow" tabindex="0" role="button" onclick="openDetail('${esc(x.name)}')" onkeydown="if(event.key==='Enter')openDetail('${esc(x.name)}')"><td><b>${esc(x.name)}</b><div class="small">Нажмите для детализации</div></td><td>${x.qty} ${x.unit}</td><td>${rub(x.cost)}</td><td>${rub(x.revenue)}</td><td>${rub(x.profit)}</td><td>${x.margin===null?'н/д':fmt(x.margin)+'%'}</td></tr>`);rows.push(`<tr class="total"><td>ИТОГО (${g.length} поз.)</td><td title="Количество суммируется только в одинаковых единицах">${q}</td><td>${rub(c)}</td><td>${rub(r)}</td><td>${rub(pr)}</td><td>${pct(pr,r)}</td></tr>`);let sortBtn=(k,t)=>`<button class="${sort===k?'selected':''}" onclick="setSort('${k}')">${t} ${sort===k?(desc?'↓':'↑'):'↕'}</button>`;return `<div class="card"><h2>Продажи по товарам и услугам</h2><div class="sales-tools"><label>Поиск <input id="salesSearch" type="search" placeholder="Название товара или услуги" value="${esc(salesSearch)}" oninput="setSalesSearch(this.value)"></label><div class="sort-tools"><span class="muted">Сортировка:</span> ${sortBtn('revenue','Выручка')} ${sortBtn('qty','Количество')} ${sortBtn('profit','Валовая прибыль')} ${sortBtn('margin','Валовая маржа')}</div></div><div id="salesTable">${table(th,rows)}</div><p class="small">Итоговая маржа = суммарная валовая прибыль / суммарная выручка. Количество разных единиц измерения не суммируется. Итоги учитывают поиск и общие фильтры.</p></div>${detailProduct?renderDetail(a,detailProduct):''}`}
function setSalesSearch(v){salesSearch=v;let active=document.activeElement;let caret=active&&active.selectionStart;content.innerHTML=renderSales(filtered());let inp=document.getElementById('salesSearch');inp.focus();try{inp.setSelectionRange(caret,caret)}catch(e){}}
function setSort(k){desc=sort===k?!desc:true;sort=k;render()}
function openDetail(name){detailProduct=name;render();let modal=document.getElementById('productDetail');if(modal)modal.scrollIntoView({behavior:'smooth',block:'nearest'})}
function closeDetail(){detailProduct=null;render()}
function renderDetail(a,name){let rows=a.filter(x=>x.product===name);let r=sum(rows,'revenue'),c=sum(rows,'cost');let unit=units[name]||'ед.';let monthsData=months.map((month,i)=>({month,rows:rows.filter(x=>x.month===i)})).filter(x=>x.rows.length);return `<div class="card section" id="productDetail"><div class="detail-head"><div><span class="badge">Детальная аналитика</span><h2 style="margin:12px 0">${esc(name)}</h2></div><button onclick="closeDetail()">Закрыть ✕</button></div><div class="detail-kpis">${card('Выручка',rub(r),'Выбранные фильтры')}${card('Себестоимость',rub(c),'Реализованные товары/услуги')}${card('Валовая прибыль',rub(r-c),'Выручка − себестоимость')}${card('Валовая маржа',pct(r-c,r),'При нулевой выручке н/д')}</div><h2 style="margin-top:24px">Динамика по месяцам</h2>${table(['Месяц','Количество','Выручка','Себестоимость','Валовая прибыль','Маржа'],monthsData.map(x=>{let rev=sum(x.rows,'revenue'),cost=sum(x.rows,'cost');return `<tr><td>${x.month}</td><td>${sum(x.rows,'qty')} ${unit}</td><td>${rub(rev)}</td><td>${rub(cost)}</td><td>${rub(rev-cost)}</td><td>${pct(rev-cost,rev)}</td></tr>`}))}</div>`}
function downloadCSV(){let keys=['id','date','order','product','category','channel','client','qty','revenue','cost'];let csv='\ufeff'+keys.join(';')+'\n'+tx.map(x=>keys.map(k=>String(x[k]).replace(/;/g,',')).join(';')).join('\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let link=document.createElement('a');link.href=url;link.download='sales-intelligence-demo.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}pages.forEach(x=>{let b=document.createElement('button');b.className='nav';b.textContent=x;b.onclick=()=>{section=x;render()};nav.appendChild(b)});categories.forEach(x=>category.add(new Option(x,x)));channels.forEach(x=>channel.add(new Option(x,x)));[period,category,channel].forEach(x=>x.onchange=render);reset.onclick=()=>{period.value=category.value=channel.value='all';render()};render();
</script></body></html>
