cSegment}</span></div><div class="sales-tools" style="margin:12px 0"><label>Финансовые риски <select onchange="abcRiskFilter=this.value;render()"><option value="all" ${abcRiskFilter==='all'?'selected':''}>Все товары</option><option value="loss" ${abcRiskFilter==='loss'?'selected':''}>Есть убыточные продажи</option><option value="returns" ${abcRiskFilter==='returns'?'selected':''}>Есть возвраты</option><option value="both" ${abcRiskFilter==='both'?'selected':''}>Убытки и возвраты</option></select></label><span class="muted">Показано: ${risky.length} из ${shown.length}. Нажмите на товар для детализации.</span></div><div class="table-wrap">${table(['Товар / услуга','Выручка','Валовая прибыль','Доля ABC','Накопл. доля','ABC','CV','XYZ','Сегмент','Убыточных продаж','Сумма убытков','Возвратов'],tr)}</div><p class="small">Для ABC по прибыли отрицательные значения вынесены в «Убыток», нулевые — «Нет вклада». Порог применяется к накопленной доле до включения позиции. Пустые ассортиментные позиции учитываются, даже если операций нет. Сумма убытков учитывает только продажи ниже себестоимости, без зачёта прибыльных продаж. Возвраты показаны отдельно. Индикаторы не меняют ABC / XYZ.</p></div>${detailProduct?renderDetail(a,detailProduct):''}<div class="card section"><h2>Диагностика ассортимента</h2>${issues.length?issues.map(x=>`<div class="note">${x}</div>`).join(''):'<p>По текущей выборке заданные правила не выявили предупреждений.</p>'}</div>`;

function setABCThreshold(k,v){let n=Number(v);if(!Number.isFinite(n))return;if(k==='a')abcA=Math.max(1,Math.min(abcB-1,n));if(k==='b')abcB=Math.max(abcA+1,Math.min(99,n));if(k==='x')xyzX=Math.max(0,Math.min(xyzY-1,n));if(k==='y')xyzY=Math.max(xyzX+1,Math.min(200,n));render()}
function uniqueOrders(a){return new Set(a.filter(x=>x.type!=='return').map(x=>x.order))}
function clientStats(a){let groups=new Map();for(let x of a){if(!groups.has(x.client))groups.set(x.client,{name:x.client,rows:[],revenue:0,cost:0});let g=groups.get(x.client);g.rows.push(x);g.revenue+=x.revenue;g.cost+=x.cost;}return [...groups.values()].map(g=>{let sales=g.rows.filter(x=>x.type!=='return'),dates=sales.map(x=>x.date).sort(),orders=uniqueOrders(sales).size;return {...g,orders,last:dates.at(-1)||'',first:dates[0]||'',profit:g.revenue-g.cost}})}
function clientSegments(a){
 let cs=clientStats(a).sort((x,y)=>y.revenue-x.revenue), all=clientStats(tx), first=new Map(all.map(x=>[x.name,x.first]));
 let selectedMonths=[...new Set(a.map(x=>x.month))].sort((x,y)=>x-y), endMonth=selectedMonths.length?selectedMonths.at(-1):5;
 let periodEnd=period.value==='custom'?dateTo.value:`2026-${String(endMonth+1).padStart(2,'0')}-${new Date(2026,endMonth+1,0).getDate()}`;
 let minDate=a.map(x=>x.date).sort()[0]||'2026-01-01';
 let result=cs.map(x=>{
  let last=x.last, days=last?Math.max(0,Math.round((new Date(periodEnd+'T00:00:00')-new Date(last+'T00:00:00'))/86400000)):null;
  let rs=days===null?0:days<=rfmR?3:days<=rfmR*2?2:1;
  let fs=x.orders>=rfmF?3:x.orders>=2?2:1;
  let ms=x.revenue>=rfmM?3:x.revenue>=rfmM/3?2:1;
  let segment=rs===3&&fs===3&&ms===3?'Чемпионы':rs===1&&fs>=2?'Под риском':fs===1?'Новые / разовые':rs>=2&&fs>=2?'Постоянные':'Прочие';
  let isNew=first.get(x.name)>=minDate&&first.get(x.name)<=periodEnd&&!((dataMode==='demo')&&Number(x.name.slice(-3))<=80);
  return {...x,days,rs,fs,ms,segment,isNew};
 });
 return {result,periodEnd,minDate};
}
function profitClientStats(a){
 const m=new Map();
 for(const x of a){if(!m.has(x.client))m.set(x.client,{name:x.client,revenue:0,cost:0,lossCount:0,loss:0,lossOrders:new Set()});
 const c=m.get(x.client);c.revenue+=x.revenue;c.cost+=x.cost;
 if(x.type!=='return'&&x.revenue<x.cost){c.lossCount++;c.loss+=x.cost-x.revenue;c.lossOrders.add(x.order)} }
 return [...m.values()].map(c=>({...c,profit:c.revenue-c.cost,margin:c.revenue?100*(c.revenue-c.cost)/c.revenue:null,lossOrdersCount:c.lossOrders.size}));
}

function normalizePlan(rows){if(!rows.length)throw Error('Файл плана пуст');let needed=['month','category','channel','plan'],missing=needed.filter(k=>!(k in rows[0]));if(missing.length)throw Error('Отсутствуют колонки: '+missing.join(', '));let seen=new Set(),result=[];rows.forEach((x,i)=>{let raw=String(x.month??'').trim();let m=/^2026-(0[1-6])$/.exec(raw);if(!m)throw Error('Строка '+(i+2)+': месяц должен быть от 2026-01 до 2026-06');let categoryName=String(x.category??'').trim(),channelName=String(x.channel??'').trim(),value=normalNum(x.plan);if(!categoryName||!channelName||!Number.isFinite(value)||value<0)throw Error('Строка '+(i+2)+': проверьте категорию, канал и неотрицательный план');let month=Number(m[1])-1,key=[month,categoryName,channelName].join('|');if(seen.has(key))throw Error('Повтор комбинации месяца, категории и канала в строке '+(i+2));seen.add(key);result.push({month,category:categoryName,channel:channelName,plan:value})});return result}
async function importPlan(file){if(!file)return;try{let rows;if(/\.csv$/i.test(file.name))rows=parseCSV(await file.text());else if(/\.xlsx?$/i.test(file.name)){if(typeof XLSX==='undefined')throw Error('Библиотека Excel недоступна. Сохраните файл как CSV.');let wb=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}).map(x=>Object.fromEntries(Object.entries(x).map(([k,v])=>[k.trim().toLowerCase(),v])))}else throw Error('Поддерживаются CSV и Excel');let parsed=normalizePlan(rows);planRows=parsed;planMode='import';planError='';savePlanState();render()}catch(e){planError='План не загружен: '+e.message;render()}}
function restoreDemoPlan(){if(planMode==='import'&&!confirm('Заменить загруженный бюджет демонстрационным? Сохранённый план будет удалён из браузера.'))return;planRows=demoPlan.map(x=>({...x}));planMode='demo';planError='';savePlanState();render()}
function downloadPlanTemplate(){let csv='\ufeffmonth;category;channel;plan\n'+demoPlan.map(x=>['2026-'+String(x.month+1).padStart(2,'0'),x.category,x.channel,x.plan].join(';')).join('\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='sales-intelligence-plan-template.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

 });

 if(negativeMonths.length){

function renderSalesOverview(a){let all=group(a,'product').map(x=>({...x,profit:x.revenue-x.cost,margin:x.revenue?100*(x.revenue-x.cost)/x.revenue:null,unit:units[x.name]||'ед.'}));let g=all.filter(x=>x.name.toLocaleLowerCase('ru').includes(salesSearch.toLocaleLowerCase('ru')));g.sort((x,y)=>{let av=x[sort],bv=y[sort];return (desc?-1:1)*((av??-Infinity)-(bv??-Infinity))});let r=sum(g,'revenue'),c=sum(g,'cost'),pr=r-c;let sameUnit=new Set(g.map(x=>x.unit)).size===1;let q=sameUnit?sum(g,'qty')+' '+(g[0]?.unit||''): '—';let th=['Товар / услуга','Количество','Себестоимость','Выручка','Валовая прибыль','Валовая маржа'];let rows=g.map(x=>`<tr class="clickrow" tabindex="0" role="button" onclick="openDetail('${esc(x.name)}')" onkeydown="if(event.key==='Enter')openDetail('${esc(x.name)}')"><td><b>${esc(x.name)}</b><div class="small">Нажмите для детализации</div></td><td>${x.qty} ${x.unit}</td><td>${rub(x.cost)}</td><td>${rub(x.revenue)}</td><td>${rub(x.profit)}</td><td>${x.margin===null?'н/д':fmt(x.margin)+'%'}</td></tr>`);rows.push(`<tr class="total"><td>ИТОГО (${g.length} поз.)</td><td title="Количество суммируется только в одинаковых единицах">${q}</td><td>${rub(c)}</td><td>${rub(r)}</td><td>${rub(pr)}</td><td>${pct(pr,r)}</td></tr>`);let sortBtn=(k,t)=>`<button class="${sort===k?'selected':''}" onclick="setSort('${k}')">${t} ${sort===k?(desc?'↓':'↑'):'↕'}</button>`;return `<div class="card"><h2>Продажи по товарам и услугам</h2><div class="sales-tools"><label>Поиск <input id="salesSearch" type="search" placeholder="Название товара или услуги" value="${esc(salesSearch)}" oninput="setSalesSearch(this.value)"></label><div class="sort-tools"><span class="muted">Сортировка:</span> ${sortBtn('revenue','Выручка')} ${sortBtn('qty','Количество')} ${sortBtn('profit','Валовая прибыль')} ${sortBtn('margin','Валовая маржа')}</div></div><div id="salesTable">${table(th,rows)}</div><p class="small">Итоговая маржа = суммарная валовая прибыль / суммарная выручка. Количество разных единиц и function productRiskRows(a){let map=new Map();for(let x of a){if(!map.has(x.product))map.set(x.product,{name:x.product,revenue:0,cost:0,lossCount:0,loss:0,discount:0,returns:0,returnCount:0,salesRevenue:0});let z=map.get(x.product);z.revenue+=x.revenue;z.cost+=x.cost;if(x.type==='return'){z.returnCount++;z.returns+=Math.abs(x.revenue)}else{z.salesRevenue+=x.revenue;z.discount+=Math.max(0,x.discountAmount||0);if(x.revenue<x.cost){z.lossCount++;z.loss+=x.cost-x.revenue}}}return [...map.values()].map(z=>({...z,profit:z.revenue-z.cost,margin:z.revenue?100*(z.revenue-z.cost)/z.revenue:null}))}
function renderSalesControl(a){let data=productRiskRows(a),loss=data.filter(x=>x.lossCount>0),returns=data.filter(x=>x.returnCount>0),negative=data.filter(x=>x.profit<0);let lossTotal=sum(data,'loss'),returnTotal=sum(data,'returns'),returnCount=sum(data,'returnCount'),discountTotal=sum(data,'discount');let controls=[['loss','Убыточные продажи'],['returns','Возвраты'],['negative','Отрицательная итоговая прибыль'],['all','Все товары']];let shown=data.filter(x=>salesControlFilter==='loss'?x.lossCount>0:salesControlFilter==='returns'?x.returnCount>0:salesControlFilter==='negative'?x.profit<0:true).filter(x=>x.name.toLocaleLowerCase('ru').includes(salesSearch.toLocaleLowerCase('ru')));shown.sort((x,y)=>salesControlSort==='name'?x.name.localeCompare(y.name,'ru'):(y[salesControlSort]||0)-(x[salesControlSort]||0));let rows=shown.map(x=>`<tr class="clickrow" tabindex="0" role="button" onclick="openDetail('${esc(x.name)}')" onkeydown="if(event.key==='Enter')openDetail('${esc(x.name)}')"><td><b>${esc(x.name)}</b></td><td>${x.lossCount}</td><td class="${x.loss?'loss-text':''}">${rub(x.loss)}</td><td>${x.returnCount}</td><td>${rub(x.returns)}</td><td>${rub(x.discount)}</td><td>${rub(x.revenue)}</td><td>${rub(x.profit)}</td><td>${x.margin===null?'н/д':fmt(x.margin)+'%'}</td></tr>`);let totalLoss=sum(shown,'loss'),totalReturns=sum(shown,'returns');return `<div class="kpis">${card('Товары с убыточными продажами',String(loss.length),'Хотя бы одна продажа ниже себестоимости')}${card('Убыточные операции',String(sum(data,'lossCount')),'Возвраты исключены')}${card('Сумма убытков',rub(lossTotal),'Без зачёта прибыльных продаж')}${card('Возвраты',rub(returnTotal),`${returnCount} операций; уже учтены в чистой выручке`)}</div><div class="card section"><h2>Контроль прибыльности и возвратов по ассортименту</h2><p>Убыточная продажа: выручка меньше себестоимости конкретной операции. Возвраты показываются отдельно и не считаются убыточными продажами. Скидки не равны доказанному убытку.</p><div class="segment-counts">${controls.map(([v,t])=>`<button class="segment-count ${salesControlFilter===v?'active':''}" onclick="setSalesControlFilter('${v}')">${t} · ${v==='loss'?loss.length:v==='returns'?returns.length:v==='negative'?negative.length:data.length}</button>`).join('')}</div><div class="sales-tools"><label>Поиск товара <input id="salesSearch" type="search" placeholder="Название товара" value="${esc(salesSearch)}" oninput="setSalesSearch(this.value)"></label><label>Сортировка <select onchange="setSalesControlSort(this.value)"><option value="loss" ${salesControlSort==='loss'?'selected':''}>Сумма убытков ↓</option><option value="lossCount" ${salesControlSort==='lossCount'?'selected':''}>Убыточные операции ↓</option><option value="returns" ${salesControlSort==='returns'?'selected':''}>Сумма возвратов ↓</option><option value="returnCount" ${salesControlSort==='returnCount'?'selected':''}>Количество возвратов ↓</option><option value="discount" ${salesControlSort==='discount'?'selected':''}>Скидки ↓</option><option value="revenue" ${salesControlSort==='revenue'?'selected':''}>Выручка ↓</option><option value="name" ${salesControlSort==='name'?'selected':''}>По названию</option></select></label></div><p class="small">Показано ${shown.length} из ${data.length} товаров. Нажмите на строку для детализации.</p>${shown.length?table(['Товар / услуга','Убыточных продаж','Сумма убытков','Возвратов','Сумма возвратов','Скидки','Чистая выручка','Валовая прибыль','Маржа'],rows):'<div class="empty">По выбранным условиям товары не найдены.</div>'}<p class="small">Сумма убытков по выбранным товарам: ${rub(totalLoss)}. Возвраты по выбранным товарам: ${rub(totalReturns)}. Сумма скидок по всей выборке: ${rub(discountTotal)}. Общие фильтры периода, категории и канала применяются ко всем показателям.</p></div>${detailProduct?renderDetail(a,detailProduct):''}`}

function renderProductWarnings(rows){
 const quarterData=[0,1].map(q=>{let a=rows.filter(x=>Math.floor(x.month/3)===q);return {q,rows:a,profit:sum(a,'revenue')-sum(a,'cost'),revenue:sum(a,'revenue')}});
 const monthly=months.map((name,i)=>{let a=rows.filter(x=>x.month===i);return {name,rows:a,profit:sum(a,'revenue')-sum(a,'cost')}});
 const loss=rows.filter(x=>x.type!=='return'&&x.revenue<x.cost);
 const returns=rows.filter(x=>x.type==='return');
 let messages=[];
 const [q1,q2]=quarterData;
 if(q1.rows.length&&q2.rows.length&&q1.profit>0&&q2.profit<0){messages.push(`<b>Ухудшение прибыльности:</b> I квартал ${rub(q1.profit)}, II квартал ${rub(q2.profit)}. Валовая прибыль перешла в отрицательную зону.`)}
 else if(q1.rows.length&&q2.rows.length&&q2.profit<q1.profit){messages.push(`<b>Снижение валовой прибыли:</b> I квартал ${rub(q1.profit)}, II квартал ${rub(q2.profit)}. Для оценки причин необходимо проверить сопоставимость объёмов, цен и себестоимости.`)}
 const neg=monthly.filter(x=>x.rows.length&&x.profit<0);
 if(neg.length)messages.push(`<b>Убыточные месяцы:</b> ${neg.map(x=>`${x.name} (${rub(x.profit)})`).join(', ')}.`);
 if(loss.length)messages.push(`<b>Продажи ниже себестоимости:</b> ${loss.length} операций, сумма отрицательной валовой прибыли по ним ${rub(sum(loss.map(x=>({v:x.cost-x.revenue})),'v'))}. Это не равно итоговому убытку товара.`);
 if(returns.length)messages.push(`<b>Возвраты:</b> ${returns.length} операций на ${rub(-sum(returns,'revenue'))}. Возвраты учитываются отдельно от продаж ниже себестоимости.`);
 if(!messages.length)return `<div class="note" style="margin-top:18px"><b>Финансовые предупреждения:</b> по выбранным данным критерии риска не сработали.</div>`;
 return `<div class="card" style="margin-top:20px;padding:18px;border:1px solid #e6c8a4;background:#fffaf3"><h2 style="margin:0 0 12px">Финансовые предупреждения</h2>${messages.map(x=>`<div class="note" style="margin:8px 0;border-left:3px solid #d6a15d;padding:10px 12px">${x}</div>`).join('')}<p class="small" style="margin:12px 0 0">Подтверждены показатели операций, но не причины изменений. Для проверки причин сопоставьте цены, скидки, себестоимость и количество продаж по периодам. Предупреждения учитывают текущие фильтры.</p></div>`;
}
function renderDetail(a,name){let rows=a.filter(x=>x.product===name);let r=sum(rows,'revenue'),c=sum(rows,'cost');let unit=units[name]||'ед.';let monthsData=months.map((month,i)=>({month,rows:rows.filter(x=>x.month===i)})).filter(x=>x.rows.length);return `<div class="card section" id="productDetail"><div class="detail-head"><div><span class="badge">Детальная аналитика</span><h2 style="margin:12px 0">${esc(name)}</h2></div><button onclick="closeDetail()">Закрыть ✕</button></div><div class="detail-kpis">${card('Выручка',rub(r),'Выбранные фильтры')}${card('Себестоимость',rub(c),'Реализованные товары/услуги')}${card('Валовая прибыль',rub(r-c),'Выручка − себестоимость')}${card('Валовая маржа',pct(r-c,r),'При нулевой выручке н/д')}</div><div class="detail-kpis" style="margin-top:12px">${card('Убыточные продажи',String(rows.filter(x=>x.type!=='return'&&x.revenue<x.cost).length),'Без возвратов')}${card('Сумма убытков',rub(sum(rows.filter(x=>x.type!=='return'&&x.revenue<x.cost).map(x=>({v:x.cost-x.revenue})),'v')),'Без зачёта прибыльных продаж')}${card('Возвраты',rub(-sum(rows.filter(x=>x.type==='return'),'revenue')),'Сумма возвратов')}</div>${renderProductWarnings(rows)}<h2 style="margin-top:24px">Динамика по месяцам</h2>${table(['Месяц','Количество','Выручка','Себестоимость','Валовая прибыль','Маржа'],monthsData.map(x=>{let rev=sum(x.rows,'revenue'),cost=sum(x.rows,'cost');return `<tr><td>${x.month}</td><td>${sum(x.rows,'qty')} ${unit}</td><td>${rub(rev)}</td><td>${rub(cost)}</td><td>${rub(rev-cost)}</td><td>${pct(rev-cost,rev)}</td></tr>`}))}</div>`}
function restoreDemo(){if(planMode==='import'&&!confirm('Восстановить демонстрационные данные и заменить загруженный бюджет демонстрационным?'))return;tx=demoTx.map(x=>({...x}));dataMode='demo';dataWarnings=[];planRows=demoPlan.map(x=>({...x}));planMode='demo';planError='';savePlanState();refreshFilters();render()}
function refreshFilters(){for(let [el,key] of [[category,'category'],[channel,'channel']]){el.innerHTML='<option value="all">'+(key==='category'?'Все категории':'Все каналы')+'</option>';[...new Set(tx.map(x=>x[key]))].filter(Boolean).sort().forEach(x=>el.add(new Option(x,x)))}category.value=channel.value=period.value='all';dateFrom.value='2026-01-01';dateTo.value='2026-06-30';dateRange.style.display='none'}
function parseCSV(text){let lines=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').split('\n').filter(x=>x.trim());if(!lines.length)throw Error('Пустой файл');let delim=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';function parseLine(line){let result=[],field='',quote=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){field+='"';i++}else quote=!quote}else if(c===delim&&!quote){result.push(field);field=''}else field+=c}result.push(field);return result}let keys=parseLine(lines[0]).map(x=>x.trim().toLowerCase());return lines.slice(1).map(line=>Object.fromEntries(parseLine(line).map((v,i)=>[keys[i],v.trim()]))) }
function normalNum(v){if(typeof v==='number')return v;let s=String(v??'').replace(/\s|\u00a0|₽/g,'').replace(',','.');return s===''?NaN:Number(s)}
function normalizeRows(rows){let required=['date','order','product','category','channel','client','qty','revenue','cost'];if(!rows.length)throw Error('Нет строк данных');let missing=required.filter(k=>!(k in rows[0]));if(missing.length)throw Error('Не хватает колонок: '+missing.join(', '));let errors=[],out=[];rows.forEach((row,i)=>{let n=i+2,date=String(row.date??'').slice(0,10),qty=normalNum(row.qty),revenue=normalNum(row.revenue),cost=normalNum(row.cost);if(!/^2026-0[1-6]-[0-3]\d$/.test(date)||!Number.isFinite(Date.parse(date+'T00:00:00'))||![qty,revenue,cost].every(Number.isFinite)||!row.order||!row.product||!row.client){errors.push('Строка '+n+': некорректные дата, сумма, количество или идентификаторы');return}let type=String(row.type||'sale').toLowerCase()==='return'?'return':'sale';if(type==='return'&&(qty>0||revenue>0||cost>0)){errors.push('Строка '+n+': возврат должен содержать отрицательные количество, выручку и себестоимость');return}if(type==='sale'&&(qty<0||revenue<0||cost<0)){errors.push('Строка '+n+': для продажи ожидаются неотрицательные значения');return}out.push({id:i+1,date,month:new Date(date+'T00:00:00').getMonth(),order:String(row.order),product:String(row.product),category:String(row.category),channel:String(row.channel),client:String(row.client),qty,revenue,cost,type,gross:Number.isFinite(normalNum(row.gross))?normalNum(row.gross):null,discountAmount:Number.isFinite(normalNum(row.discountamount??row.discountAmount))?normalNum(row.discountamount??row.discountAmount):null})});if(errors.length)throw Error(errors.slice(0,5).join('; ')+(errors.length>5?'; и ещё '+(errors.length-5):''));return out}
async function importData(file){if(!file)return;try{let rows;if(/\.csv$/i.test(file.name)){rows=parseCSV(await file.text())}else if(/\.xlsx?$/i.test(file.name)){if(typeof XLSX==='undefined')throw Error('Для Excel требуется доступ к библиотеке XLSX. Сохраните таблицу как CSV и повторите загрузку.');let book=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}),raw=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{defval:''});rows=raw.map(o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k.trim().toLowerCase(),v instanceof Date?v.toISOString().slice(0,10):v])))}else throw Error('Поддерживаются CSV, XLSX, XLS');let parsed=normalizeRows(rows);tx=parsed;dataMode='import';planRows=[];planMode='none';planError='';savePlanState();dataWarnings=[];if(new Set(tx.map(x=>x.date.slice(0,7))).size<3)dataWarnings.push('XYZ: в данных менее 3 месяцев. Для устойчивой классификации требуется более длинная история.');dataWarnings.push('Прототип v0.4.1 принимает даты января–июня 2026 года; для других периодов потребуется расширение календаря.');dataWarnings.push('План-факт: загрузите отдельный план компании с детализацией по месяцам, категориям и каналам.');refreshFilters();render()}catch(e){dataWarnings=['Импорт не выполнен: '+e.message];render()}}
function downloadCSV(){let keys=['id','date','order','product','category','channel','client','qty','revenue','cost','type','gross','discountAmount'];let csv='\ufeff'+keys.join(';')+'\n'+tx.map(x=>keys.map(k=>String(x[k]??'').replace(/;/g,',')).join(';')).join('\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let link=document.createElement('a');link.href=url;link.download='sales-intelligence-demo.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}pages.forEach(x=>{let b=document.createElement('button');b.className='nav';b.textContent=x;b.onclick=()=>{section=x;render()};nav.appendChild(b)});categories.forEach(x=>category.add(new Option(x,x)));channels.forEach(x=>channel.add(new Option(x,x)));[period,category,channel,dateFrom,dateTo].forEach(x=>x.onchange=render);reset.onclick=()=>{period.value=category.value=channel.value='all';dateFrom.value='2026-01-01';dateTo.value='2026-06-30';dateRange.style.display='none';render()};render();

// Unified financial table notation: units in headings, bare numbers in cells.
function normalizeFinancialDisplay(root){
 const currency=/^(?:[-−]?\s*)?[\d\s\u00a0\u202f]+(?:[,.]\d+)?\s*₽$/u;
 const percent=/^(?:[-−]?\s*)?[\d\s\u00a0\u202f]+(?:[,.]\d+)?\s*%$/u;
 const amountHead=/выручк|прибыл|себестоим|убытк|скидк|возврат|план$|факт$|отклонение|до скидки|сумма|средний чек|оборот|затрат|доход|расход/i;
 const percentHead=/марж|доля|выполнени|отклонение,\s*%|\bCV\b|рентабельност/i;
 for(const t of root.querySelectorAll('table')){
   const headings=[...t.querySelectorAll('thead th')];
   const types=headings.map(h=>{
     const label=h.textContent.trim();
     if(/,\s*(?:руб\.|%|₽)\s*$/i.test(label))return /%\s*$/.test(label)?'%':'rub';
     if(percentHead.test(label)){h.textContent=label+', %';return '%'}
     if(amountHead.test(label)){h.textContent=label+', руб.';return 'rub'}
     return '';
   });
   for(const tr of t.querySelectorAll('tbody tr')){
     [...tr.children].forEach((td,i)=>{
       if(!types[i])return;
       // Replace only plain numeric cell text; never alter links, badges or drilldown content.
       if(td.children.length===0){
         const v=td.textContent.trim();
         if(types[i]==='rub'&&currency.test(v))td.textContent=v.replace(/\s*₽$/u,'');
         if(types[i]==='%'&&percent.test(v))td.textContent=v.replace(/\s*%$/u,'');
       }
       td.classList.add('financial-cell');
     });
   }
 }
 for(const card of root.querySelectorAll('.card')){
   const label=card.querySelector(':scope > .kpi-label');
   const value=card.querySelector(':scope > .num');
   if(!label||!value)continue;
   const v=value.textContent.trim();
   if(currency.test(v)){
     value.textContent=v.replace(/\s*₽$/u,'');
     if(!/,\s*(руб\.|₽)\s*$/i.test(label.textContent))label.textContent+=', руб.';
   }else if(percent.test(v)){
     value.textContent=v.replace(/\s*%$/u,'');
     if(!/,\s*%\s*$/.test(label.textContent))label.textContent+=', %';
   }
 }
 for(const matrix of root.querySelectorAll('.matrix-cell small')){
   const v=matrix.textContent.trim();
   if(currency.test(v))matrix.textContent=v.replace(/\s*₽$/u,'');
 }
}
