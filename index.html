6px 0 0;min-height:2px;background:#2f6b86}.bar.profit{background:#d8a66b}.legend{font-size:12px;color:#667c8c;margin-top:15px}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 5px 0 15px;background:#2f6b86}.dot.gold{background:#d8a66b}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:13px 9px;border-bottom:1px solid #edf1f4}th{color:#728695;font-weight:600}th[data-sort]{cursor:pointer}td:last-child,th:last-child{text-align:right}.badge{display:inline-block;border-radius:20px;padding:5px 10px;background:#e8f1f4;color:#2f6b86;font-size:12px}.note{border-left:3px solid #d8a66b;padding:12px 16px;background:#fbf8f1;border-radius:0 8px 8px 0;margin:12px 0}.hidden{display:none}.muted{color:#748898}.section{margin-top:20px}.progress{background:#e8f1f4;border-radius:5px;height:9px;overflow:hidden}.progress>div{height:100%;background:#2f6b86}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.empty{padding:28px;background:#f4f8fa;border-radius:12px;text-align:center}footer{margin:26px 0;color:#8798a4;font-size:12px}@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}aside{width:100%;padding:15px}.brand{margin:0}.sub{margin:4px 0 10px}.navbox{display:flex;overflow:auto;gap:4px}.nav{white-space:nowrap;width:auto;padding:10px}main{padding:22px 14px}.kpis{gap:8px}.card{padding:15px}.num{font-size:21px}.grid2{grid-template-columns:1fr}h1{font-size:24px}}.sales-tools{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin:14px 0 20px}.sales-tools label{display:grid;gap:6px;color:#667c8c;font-size:13px}.sales-tools input{min-width:240px;padding:11px;border:1px solid #d6e1e9;border-radius:9px;font:inherit}.sort-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.sort-tools button{font-size:12px;padding:9px}.sort-tools .selected{background:#e8f1f4;border-color:#2f6b86}.clickrow{cursor:pointer}.clickrow:hover{background:#f0f7fa}.total{background:#edf5f8;font-weight:750}.total td{border-top:2px solid #2f6b86}.detail-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.detail-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.detail-kpis .card{padding:14px}.detail-kpis .num{font-size:21px}@media(max-width:1100px){.detail-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.detail-kpis{grid-template-columns:1fr 1fr}.sales-tools input{min-width:0;width:100%}.detail-kpis .num{font-size:17px}} </style><style>.riskgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.riskbox{border:1px solid #e3eaf0;border-radius:12px;padding:15px;background:#fff}.riskbox strong{display:block;font-size:19px;margin:9px 0}.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.matrix button{display:flex;align-items:center;justify-content:space-between;background:#edf5f8}.matrix button.chosen{border:2px solid #2f6b86}.matrix small{color:#61798b}.abc-tools{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 22px}.abc-tools label{display:flex;align-items:center;gap:6px;font-size:12px}.abc-tools input{width:70px;padding:9px;border:1px solid #d6e1e9;border-radius:8px}.risk-note{font-size:12px;color:#6b7e8b;margin-top:12px}@media(max-width:800px){.riskgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.matrix{grid-template-columns:1fr}.riskgrid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside><div class="brand">◈ Sales Intelligence</div><div class="sub">АНАЛИТИКА ПРОДАЖ · DEMO</div><div class="navbox" id="nav"></div></aside><main><header><div><h1 id="title">Дашборд продаж</h1><p id="subtitle">Управленческая аналитика на демонстрационных данных</p></div><span class="badge">● Демо-режим</span></header><div class="filters"><select id="period"><option value="all">Январь — июнь 2026</option><option value="q1">I квартал 2026</option><option value="q2">II квартал 2026</option><option value="jun">Июнь 2026</option></select><select id="category"><option value="all">Все категории</option></select><select id="channel"><option value="all">Все каналы</option></select><button id="reset">Сбросить фильтры</button></div><div id="content" class="section"></div><footer>Sales Intelligence · Интерактивный прототип v0.2 · Все данные демонстрационные. Импорт Excel/CSV — следующий этап.</footer></main></div><script>
const categories=['Электроника','Аксессуары','Товары для дома','Услуги'];const channels=['Сайт','Маркетплейс','Прямые продажи'];const products=[['Ноутбук',0,65000,46000],['Наушники',0,9200,5400],['Чехол',1,1800,760],['Зарядное устройство',1,3200,1800],['Настольная лампа',2,4800,2600],['Органайзер',2,2100,950],['Консультация',3,12500,4000],['Настройка',3,7500,2600],['Портативная колонка',0,5900,3900],['Декоративная ваза',2,3100,1750],['Смарт-часы',0,14500,9200]];const months=['Янв','Фев','Мар','Апр','Май','Июн'];let tx=[];let id=1;for(let m=0;m<6;m++)for(let p=0;p<products.length;p++)for(let k=0;k<(p===10?0:p===2?[22,17,10,4,0,0][m]:p===9?[12,9,6,3,1,0][m]:p===8?[0,2,0,11,0,17][m]:13+(m*2)+(p%3)*3);k++){let q=1+(k%3),price=products[p][2]*(1+(m%3)*.025),discount=p===1&&m>=3?.48:p===4&&m===4?.52:p===7&&m===5?.70:k%9===0?.08:0,rev=Math.round(q*price*(1-discount)),cost=q*products[p][3];tx.push({id:id++,month:m,date:`2026-${String(m+1).padStart(2,'0')}-${String(k%27+1).padStart(2,'0')}`,product:products[p][0],category:categories[products[p][1]],channel:channels[(k+p+m)%3],client:`Клиент ${String((k*7+p*11+m)%120+1).padStart(3,'0')}`,qty:q,revenue:rev,cost,gross:Math.round(q*price),discountAmount:Math.round(q*price)-rev,type:'sale',order:`ORD-${m}-${p}-${k}`});if((p===0&&m===3&&k===2)||(p===1&&m===4&&k===1)||(p===4&&m===5&&k===2)){let t=tx[tx.length-1];tx.push({...t,id:id++,qty:-t.qty,revenue:-t.revenue,cost:-t.cost,gross:-t.gross,discountAmount:-t.discountAmount,type:'return'})}}let section='Дашборд';let sort='revenue';let desc=true;let salesSearch='';let detailProduct=null;let abcMetric='revenue',abcA=80,abcB=95,xyzX=10,xyzY=25,abcSegment='all';const units={'Консультация':'усл.','Настройка':'усл.','Ноутбук':'шт.','Наушники':'шт.','Чехол':'шт.','Зарядное устройство':'шт.','Настольная лампа':'шт.','Органайзер':'шт.','Портативная колонка':'шт.','Декоративная ваза':'шт.','Смарт-часы':'шт.'};const pages=['Дашборд','Анализ продаж','ABC / XYZ','Клиенты','План-факт','Аналитик','Данные'];const rub=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n)+' ₽';const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);const pct=(a,b)=>b?fmt(a/b*100)+'%':'н/д';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function filtered(){return tx.filter(x=>(period.value==='all'||(period.value==='q1'&&x.month<3)||(period.value==='q2'&&x.month>=3)||(period.value==='jun'&&x.month===5))&&(category.value==='all'||x.category===category.value)&&(channel.value==='all'||x.channel===channel.value))}function group(a,k){let m=new Map();for(let x of a){let key=x[k];if(!m.has(key))m.set(key,{name:key,revenue:0,cost:0,qty:0,count:0});let o=m.get(key);o.revenue+=x.revenue;o.cost+=x.cost;o.qty+=x.qty;o.count++}return [...m.values()]}function card(label,value,sub){return `<div class="card"><div class="kpi-label">${label}</div><div class="num">${value}</div><div class="small">${sub}</div></div>`}function table(head,rows){return `<div style="overflow:auto"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function bars(a){let mm=months.map((m,i)=>({name:m,revenue:sum(a.filter(x=>x.month===i),'revenue'),profit:sum(a.filter(x=>x.month===i),'revenue')-sum(a.filter(x=>x.month===i),'cost')}));let max=Math.max(...mm.map(x=>x.revenue),1);return `<div class="bars">${mm.map(x=>`<div class="barcol"><div class="barstack"><div class="bar" title="Выручка: ${rub(x.revenue)}" style="height:${x.revenue/max*100}%"></div><div class="bar profit" title="Валовая прибыль: ${rub(x.profit)}" style="height:${Math.max(0,x.profit)/max*100}%"></div></div>${x.name}</div>`).join('')}</div><div class="legend"><i class="dot"></i>Выручка <i class="dot gold"></i>Валовая прибыль</div>`}
function chosenMonths(){return [0,1,2,3,4,5].filter(m=>period.value==='all'||period.value==='q1'&&m<3||period.value==='q2'&&m>=3||period.value==='jun'&&m===5)}
function riskPanel(a){let sales=a.filter(t=>t.type!=='return'),returns=a.filter(t=>t.type==='return'),loss=sales.filter(t=>t.revenue<t.cost),lost=sum(loss,'cost')-sum(loss,'revenue'),discount=sum(sales,'discountAmount'),returned=-sum(returns,'revenue');let zero=products.filter(p=>(category.value==='all'||categories[p[1]]===category.value)&&!a.some(t=>t.product===p[0]&&t.qty>0));return '<div class="card section"><h2>Финансовые риски и сигналы</h2><div class="riskgrid"><div class="riskbox"><span class="kpi-label">Продажи ниже себестоимости</span><strong>'+rub(lost)+'</strong><span class="small">'+loss.length+' операций</span></div><div class="riskbox"><span class="kpi-label">Предоставленные скидки</span><strong>'+rub(discount)+'</strong><span class="small">Не равны доказанному убытку</span></div><div class="riskbox"><span class="kpi-label">Возвраты</span><strong>'+rub(returned)+'</strong><span class="small">'+returns.length+' возвратов</span></div><div class="riskbox"><span class="kpi-label">Без продаж</span><strong>'+zero.length+' поз.</strong><span class="small">'+zero.map(x=>esc(x[0])).join(', ')+'</span></div></div><p class="risk-note">Возвраты учтены в выручке и себестоимости с обратным знаком. Скидки рассчитаны по исходной цене до скидки и не являются самостоятельным доказательством потери прибыли. Товары без продаж определяются по каталогу, а не только по транзакциям.</p></div>'}
function abcView(a){let all=products.filter(p=>category.value==='all'||categories[p[1]]===category.value).map(p=>{let rows=a.filter(t=>t.product===p[0]);return {name:p[0],revenue:sum(rows,'revenue'),cost:sum(rows,'cost'),profit:sum(rows,'revenue')-sum(rows,'cost'),qty:sum(rows,'qty'),rows}});let positive=all.filter(x=>x[abcMetric]>0).sort((x,y)=>y[abcMetric]-x[abcMetric]);let base=sum(positive,abcMetric),cumulative=0;for(let x of positive){let before=cumulative;cumulative+=x[abcMetric];x.abc=before/base*100<abcA?'A':before/base*100<abcB?'B':'C';x.share=100*x[abcMetric]/base;x.cumulative=100*cumulative/base}for(let x of all){if(!x.abc){x.abc=x[abcMetric]<0?'Отрицат. вклад':'Нет вклада';x.share=null;x.cumulative=null}let q=chosenMonths().map(m=>sum(x.rows.filter(t=>t.month===m),'qty')),mean=q.reduce((v,n)=>v+n,0)/q.length;x.cv=mean>0?100*Math.sqrt(q.reduce((v,n)=>v+(n-mean)**2,0)/q.length)/mean:null;x.xyz=q.length<3?'н/д':mean<=0?'Нет продаж':x.cv<=xyzX?'X':x.cv<=xyzY?'Y':'Z';x.code=x.abc.length===1&&x.xyz.length===1?x.abc+x.xyz:'—'}let codes=['AX','AY','AZ','BX','BY','BZ','CX','CY','CZ'];let matrix=codes.map(code=>{let group=all.filter(x=>x.code===code);return '<button class="'+(abcSegment===code?'chosen':'')+'" onclick="abcSegment=abcSegment===\''+code+'\'?\'all\':\''+code+'\';render()"><b>'+code+'</b><small>'+group.length+' поз. · '+rub(sum(group,'revenue'))+'</small></button>'}).join('');let rows=all.filter(x=>abcSegment==='all'||x.code===abcSegment).sort((x,y)=>y[abcMetric]-x[abcMetric]).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+rub(x.revenue)+'</td><td>'+rub(x.profit)+'</td><td>'+(x.share===null?'—':fmt(x.share)+'%')+'</td><td>'+(x.cumulative===null?'—':fmt(x.cumulative)+'%')+'</td><td>'+x.abc+'</td><td>'+(x.cv===null?'—':fmt(x.cv)+'%')+'</td><td>'+x.xyz+'</td><td><b>'+x.code+'</b></td></tr>');let zero=all.filter(x=>x.qty<=0),fall=all.filter(x=>{let q=chosenMonths();return q.length>=4&&sum(x.rows.filter(t=>t.month===q[q.length-1]),'qty')<sum(x.rows.filter(t=>t.month===q[0]),'qty')*.5});return '<div class="card"><h2>ABC / XYZ: интерактивная матрица</h2><p>ABC: классификация по выбранной метрике, положительная база; XYZ: коэффициент вариации месячных количеств, включая месяцы с нулевыми продажами. Минимум 3 месяца.</p><div class="abc-tools"><label>ABC по <select id="abcMetric"><option value="revenue">Выручке</option><option value="profit">Валовой прибыли</option></select></label>'+[['abcA','A до, %',abcA],['abcB','B до, %',abcB],['xyzX','X до, %',xyzX],['xyzY','Y до, %',xyzY]].map(([k,label,v])=>'<label>'+label+' <input type="number" id="'+k+'" value="'+v+'" min="0" max="200"></label>').join('')+'</div><div class="matrix">'+matrix+'</div><div class="sales-tools"><button onclick="abcSegment=\'all\';render()">Все сегменты</button><span class="small">Показано '+rows.length+' позиций</span></div>'+table(['Товар','Выручка','Валовая прибыль','Доля','Накопл. доля','ABC','CV','XYZ','Сегмент'],rows)+'<p class="small">Отрицательные и нулевые значения ABC-метрики не включаются в положительную базу; при отсутствии продаж XYZ отмечается отдельно.</p></div><div class="card section"><h2>Управленческие сигналы</h2><div class="note">Товары без продаж: '+(zero.length?zero.map(x=>esc(x.name)).join(', '):'не выявлены')+'.</div><div class="note">Снижение количества более чем на 50% между первым и последним месяцем выборки: '+(fall.length?fall.map(x=>esc(x.name)).join(', '):'не выявлено')+'.</div><p class="small">Это сигналы для проверки, а не доказанные причины изменения спроса.</p></div>'}
function wireAbc(){let m=document.getElementById('abcMetric');if(!m)return;m.value=abcMetric;m.onchange=()=>{abcMetric=m.value;abcSegment='all';render()};for(let [k,set] of [['abcA',v=>abcA=Math.max(1,Math.min(abcB-1,v))],['abcB',v=>abcB=Math.max(abcA+1,Math.min(99,v))],['xyzX',v=>xyzX=Math.max(0,Math.min(xyzY-1,v))],['xyzY',v=>xyzY=Math.max(xyzX+1,Math.min(200,v))]]){document.getElementById(k).onchange=e=>{let v=Number(e.target.value);if(Number.isFinite(v)){set(v);render()}}}}
function render(){let a=filtered(),r=sum(a,'revenue'),c=sum(a,'cost'),p=r-c,orders=new Set(a.map(x=>x.order)).size;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.textContent===section));title.textContent=section==='Дашборд'?'Дашборд продаж':section;let html='';if(section==='Дашборд'){html=`<div class="kpis">${card('Выручка',rub(r),'За выбранный период')}${card('Валовая прибыль',rub(p),'После себестоимости')}${card('Валовая маржа',pct(p,r),'Доля валовой прибыли')}${card('Средний чек',orders?rub(r/orders):'н/д',`${orders} заказов`)}</div><div class="layout"><div class="card"><h2>Динамика продаж</h2>${bars(a)}</div><div class="card"><h2>Выручка по категориям</h2>${group(a,'category').sort((x,y)=>y.revenue-x.revenue).map(x=>`<div style="margin:16px 0"><div style="display:flex;justify-content:space-between;gap:10px;font-size:13px"><span>${esc(x.name)}</span><b>${rub(x.revenue)}</b></div><div class="progress" style="margin-top:7px"><div style="width:${r?x.revenue/r*100:0}%"></div></div></div>`).join('')}</div></div><div class="card section"><h2>Топ товаров и услуг</h2>${table(['Наименование','Выручка','Валовая прибыль'],group(a,'product').sort((x,y)=>y.revenue-x.revenue).slice(0,6).map(x=>`<tr><td>${esc(x.name)}</td><td>${rub(x.revenue)}</td><td>${rub(x.revenue-x.cost)}</td></tr>`))}</div>`+riskPanel(a)}else if(section==='Анализ продаж'){html=renderSales(a)}else if(section==='ABC / XYZ'){html=abcView(a)}else if(section==='Клиенты'){let g=group(a,'client').sort((x,y)=>y.revenue-x.revenue);let repeat=g.filter(x=>new Set(a.filter(t=>t.client===x.name).map(t=>t.order)).size>1).length;html=`<div class="kpis">${card('Уникальные клиенты',g.length,'По ID клиента')}${card('Повторные клиенты',repeat,'Более одного заказа')}${card('Доля повторных',pct(repeat,g.length),'От клиентской базы')}${card('Выручка на клиента',g.length?rub(r/g.length):'н/д','Среднее значение')}</div><div class="card section"><h2>Топ клиентов</h2>${table(['Клиент','Выручка','Заказов'],g.slice(0,15).map(x=>`<tr><td>${esc(x.name)}</td><td>${rub(x.revenue)}</td><td>${x.count}</td></tr>`))}</div>`}else if(section==='План-факт'){let g=months.map((name,i)=>{let actual=sum(a.filter(x=>x.month===i),'revenue'),plan=Math.round(sum(tx.filter(x=>x.month===i),'revenue')*1.08);return {name,actual,plan}});let plan=sum(g,'plan');html=`<div class="kpis">${card('План выручки',rub(plan),'Демонстрационный план')}${card('Факт выручки',rub(r),'Выбранная выборка')}${card('Отклонение',rub(r-plan),'Факт минус план')}${card('Выполнение',pct(r,plan),'Факт / план')}</div><div class="card section"><h2>Помесячное выполнение</h2><div class="note">План задан для всех категорий и каналов. При фильтрации по категории или каналу сравнение становится несопоставимым. Для точного план-факта потребуется загрузка плана с такой же детализацией.</div>${table(['Месяц','План (общий)','Факт (выборка)','Отклонение'],g.map(x=>`<tr><td>${x.name}</td><td>${rub(x.plan)}</td><td>${rub(x.actual)}</td><td>${rub(x.actual-x.plan)}</td></tr>`))}</div>`}else if(section==='Аналитик'){let m=pct(p,r);let gs=group(a,'product').filter(x=>x.revenue-x.cost<0);html=`<div class="card"><h2>Автоматическая диагностика</h2><div class="note"><b>Факт:</b> выручка ${rub(r)}, валовая прибыль ${rub(p)}, валовая маржа ${m}.<br><b>Интерпретация:</b> эти значения рассчитаны по выбранным фильтрам из демонстрационных транзакций.</div><div class="note"><b>Проверка убыточных позиций:</b> ${gs.length?`Обнаружено ${gs.length} позиций с отрицательной валовой прибылью.`:'По выбранным данным товаров с отрицательной валовой прибылью нет.'}</div><p>Следующий этап: сравнение периодов, факторные отклонения, проверяемые гипотезы и рекомендации. Причины изменений без подтверждающих данных не утверждаются.</p></div>`+riskPanel(a)}else{html=`<div class="card"><h2>Управление данными</h2><div class="empty"><h2>Демонстрационный набор активен</h2><p>В памяти приложения ${tx.length} синтетических строк продаж за январь–июнь 2026 года. Данные не отправляются на сервер.</p><p>Загрузка Excel/CSV, проверка полей и сохранение данных будут реализованы на следующем этапе.</p><button onclick="downloadCSV()">Экспортировать демо CSV</button></div></div>`}content.innerHTML=html;if(section==='ABC / XYZ')wireAbc()}function renderSales(a){let all=group(a,'product').map(x=>({...x,profit:x.revenue-x.cost,margin:x.revenue?100*(x.revenue-x.cost)/x.revenue:null,unit:units[x.name]||'ед.'}));let g=all.filter(x=>x.name.toLocaleLowerCase('ru').includes(salesSearch.toLocaleLowerCase('ru')));g.sort((x,y)=>{let av=x[sort],bv=y[sort];return (desc?-1:1)*((av??-Infinity)-(bv??-Infinity))});let r=sum(g,'revenue'),c=sum(g,'cost'),pr=r-c;let sameUnit=new Set(g.map(x=>x.unit)).size===1;let q=sameUnit?sum(g,'qty')+' '+(g[0]?.unit||''): '—';let th=['Товар / услуга','Количество','Себестоимость','Выручка','Валовая прибыль','Валовая маржа'];let rows=g.map(x=>`<tr class="clickrow" tabindex="0" role="button" onclick="openDetail('${esc(x.name)}')" onkeydown="if(event.key==='Enter')openDetail('${esc(x.name)}')"><td><b>${esc(x.name)}</b><div class="small">Нажмите для детализации</div></td><td>${x.qty} ${x.unit}</td><td>${rub(x.cost)}</td><td>${rub(x.revenue)}</td><td>${rub(x.profit)}</td><td>${x.margin===null?'н/д':fmt(x.margin)+'%'}</td></tr>`);rows.push(`<tr class="total"><td>ИТОГО (${g.length} поз.)</td><td title="Количество суммируется только в одинаковых единицах">${q}</td><td>${rub(c)}</td><td>${rub(r)}</td><td>${rub(pr)}</td><td>${pct(pr,r)}</td></tr>`);let sortBtn=(k,t)=>`<button class="${sort===k?'selected':''}" onclick="setSort('${k}')">${t} ${sort===k?(desc?'↓':'↑'):'↕'}</button>`;return `<div class="card"><h2>Продажи по товарам и услугам</h2><div class="sales-tools"><label>Поиск <input id="salesSearch" type="search" placeholder="Название товара или услуги" value="${esc(salesSearch)}" oninput="setSalesSearch(this.value)"></label><div class="sort-tools"><span class="muted">Сортировка:</span> ${sortBtn('revenue','Выручка')} ${sortBtn('qty','Количество')} ${sortBtn('profit','Валовая прибыль')} ${sortBtn('margin','Валовая маржа')}</div></div><div id="salesTable">${table(th,rows)}</div><p class="small">Итоговая маржа = суммарная валовая прибыль / суммарная выручка. Количество разных единиц измерения не суммируется. Итоги учитывают поиск и общие фильтры.</p></div>${detailProduct?renderDetail(a,detailProduct):''}`}
function setSalesSearch(v){salesSearch=v;let active=document.activeElement;let caret=active&&active.selectionStart;content.innerHTML=renderSales(filtered());let inp=document.getElementById('salesSearch');inp.focus();try{inp.setSelectionRange(caret,caret)}catch(e){}}
function setSort(k){desc=sort===k?!desc:true;sort=k;render()}
function openDetail(name){detailProduct=name;render();let modal=document.getElementById('productDetail');if(modal)modal.scrollIntoView({behavior:'smooth',block:'nearest'})}
function closeDetail(){detailProduct=null;render()}
function renderDetail(a,name){let rows=a.filter(x=>x.product===name);let r=sum(rows,'revenue'),c=sum(rows,'cost');let unit=units[name]||'ед.';let monthsData=months.map((month,i)=>({month,rows:rows.filter(x=>x.month===i)})).filter(x=>x.rows.length);return `<div class="card section" id="productDetail"><div class="detail-head"><div><span class="badge">Детальная аналитика</span><h2 style="margin:12px 0">${esc(name)}</h2></div><button onclick="closeDetail()">Закрыть ✕</button></div><div class="detail-kpis">${card('Выручка',rub(r),'Выбранные фильтры')}${card('Себестоимость',rub(c),'Реализованные товары/услуги')}${card('Валовая прибыль',rub(r-c),'Выручка − себестоимость')}${card('Валовая маржа',pct(r-c,r),'При нулевой выручке н/д')}</div><h2 style="margin-top:24px">Динамика по месяцам</h2>${table(['Месяц','Количество','Выручка','Себестоимость','Валовая прибыль','Маржа'],monthsData.map(x=>{let rev=sum(x.rows,'revenue'),cost=sum(x.rows,'cost');return `<tr><td>${x.month}</td><td>${sum(x.rows,'qty')} ${unit}</td><td>${rub(rev)}</td><td>${rub(cost)}</td><td>${rub(rev-cost)}</td><td>${pct(rev-cost,rev)}</td></tr>`}))}</div>`}
function downloadCSV(){let keys=['id','date','order','product','category','channel','client','qty','revenue','cost'];let csv='\ufeff'+keys.join(';')+'\n'+tx.map(x=>keys.map(k=>String(x[k]).replace(/;/g,',')).join(';')).join('\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let link=document.createElement('a');link.href=url;link.download='sales-intelligence-demo.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}pages.forEach(x=>{let b=document.createElement('button');b.className='nav';b.textContent=x;b.onclick=()=>{section=x;render()};nav.appendChild(b)});categories.forEach(x=>category.add(new Option(x,x)));channels.forEach(x=>channel.add(new Option(x,x)));[period,category,channel].forEach(x=>x.onchange=render);reset.onclick=()=>{period.value=category.value=channel.value='all';render()};render();
</script></body></html>
